# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; during revision
# generate, the suffix variable is set to the revision id and
# the slug variable is set to the slugged revision message.
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to prepend to the "slug" identifier
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc files to be created
# sourceless = false

# version locations; default is 'migrations/versions'
# version_locations = %(here)s/bar:%(here)s/bat:migrations/versions

# version_path_separator = :

# set to 'true' to search for revisions by revision id
# as well as by tag
# search_by_revision_id = false

# set to 'true' to allow revisions to be created in any order
# version_order = false

sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/modellogger

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
